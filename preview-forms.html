<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ഫോം പ്രിവ്യൂ (Form Preview)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2 flex justify-center">

  <div class="w-full max-w-sm bg-[var(--card)] border border-[var(--border)] rounded-3xl shadow-xl overflow-hidden flex flex-col font-sans">
    
    <!-- Controls Header -->
    <div class="p-4 border-b border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-between">
      <div>
        <h3 class="font-black text-sm text-[var(--foreground)]">📱 ഫോം ഡിസൈൻ പ്രിവ്യൂ</h3>
        <p class="text-xs text-[var(--muted-foreground)]">ഹോം പേജിൽ നിന്ന് ഫോം തുറക്കുമ്പോൾ</p>
      </div>
      <div class="flex gap-1.5 bg-[var(--background)] p-1 rounded-xl border border-[var(--border)]">
        <button id="btnCurved" onclick="switchMode('curved')" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-[#0C2B59] text-white transition-all shadow-sm">
          കർവ്ഡ് പേജ് ✨
        </button>
        <button id="btnClassic" onclick="switchMode('classic')" class="px-2.5 py-1 text-xs font-bold rounded-lg text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-all">
          പഴയത്
        </button>
      </div>
    </div>

    <!-- Phone Simulator Screen -->
    <div class="relative bg-slate-100 dark:bg-slate-900 h-[500px] overflow-hidden flex flex-col">
      
      <!-- Simulated App Header (Untouched Home Screen) -->
      <div class="bg-gradient-to-r from-[#07182E] to-[#0C2B59] text-white p-3.5 flex items-center justify-between shadow-md z-0">
        <div class="flex items-center gap-2">
          <span class="text-lg">🌴</span>
          <div>
            <div class="font-extrabold text-xs tracking-wide">നമ്മുടെ നാട്</div>
            <div class="text-[10px] text-emerald-300">📍 കോട്ടയം, കേരളം</div>
          </div>
        </div>
        <div class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-300 text-xs flex items-center justify-center font-bold border border-emerald-400/30">
          ക
        </div>
      </div>

      <!-- Home Feed Demo Content -->
      <div class="p-3.5 space-y-2.5 flex-1 opacity-60 pointer-events-none">
        <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
          <div class="flex items-center gap-2 mb-2">
            <div class="w-6 h-6 rounded-full bg-slate-300 dark:bg-slate-600"></div>
            <div class="h-3 w-24 bg-slate-200 dark:bg-slate-700 rounded"></div>
          </div>
          <div class="h-2.5 w-full bg-slate-100 dark:bg-slate-700 rounded mb-1.5"></div>
          <div class="h-2.5 w-3/4 bg-slate-100 dark:bg-slate-700 rounded"></div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
          <div class="h-2.5 w-1/2 bg-slate-200 dark:bg-slate-700 rounded mb-2"></div>
          <div class="h-2.5 w-full bg-slate-100 dark:bg-slate-700 rounded mb-1.5"></div>
        </div>
      </div>

      <!-- Simulated Floating Action Button -->
      <div class="absolute bottom-4 right-4 z-10">
        <button onclick="toggleModal(true)" class="bg-[#0C2B59] text-white px-3.5 py-2.5 rounded-2xl text-xs font-black shadow-lg flex items-center gap-1.5 hover:scale-105 active:scale-95 transition-all">
          <span>✍️</span> <span>ഫോം തുറക്കൂ</span>
        </button>
      </div>

      <!-- Backdrop Overlay (Centered Floating Modal) -->
      <div id="modalOverlay" class="absolute inset-0 bg-slate-950/75 backdrop-blur-md z-20 p-3.5 flex items-center justify-center transition-opacity duration-300 opacity-100">
        
        <!-- The Floating 4-Corner Curved Card Sheet (Matches User Reference) -->
        <div id="modalSheet" class="bg-white dark:bg-slate-800 w-full max-h-[94%] rounded-[40px] shadow-[0_20px_60px_rgba(0,0,0,0.5)] p-5 flex flex-col justify-between border border-white/20 animate-slide-up overflow-y-auto">
          
          <div>
            <!-- Drag / Top Indicator -->
            <div id="dragHandle" class="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mb-3.5"></div>

            <!-- Header Row -->
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
              <div class="flex items-center gap-2">
                <span class="text-xl">📝</span>
                <div>
                  <h4 class="font-extrabold text-sm text-slate-900 dark:text-white">പുതിയ പോസ്റ്റ് ഇടാം</h4>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400">നാട്ടിലെ വിവരങ്ങൾ പങ്കുവെക്കാം</p>
                </div>
              </div>
              <button onclick="toggleModal(false)" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 hover:text-slate-900 dark:hover:text-white flex items-center justify-center font-bold text-xs">
                ✕
              </button>
            </div>

            <!-- Form Fields (Curved Design) -->
            <div class="space-y-3">
              <div>
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">ശീർഷകം (Title) *</label>
                <input id="sampleInput1" type="text" value="കോട്ടയം വാർത്തകൾ" class="w-full text-xs px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-[18px] focus:outline-none focus:border-[#0C2B59] dark:text-white font-medium">
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">വിഭാഗം (Category)</label>
                <select id="sampleSelect" class="w-full text-xs px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-[18px] focus:outline-none focus:border-[#0C2B59] dark:text-white font-medium">
                  <option>നാട്ടുവാർത്ത (Local News)</option>
                  <option>ജോബ് അറിയിപ്പ് (Jobs)</option>
                  <option>സേവനങ്ങൾ (Services)</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">വിശദാംശങ്ങൾ (Details)</label>
                <textarea id="sampleTextarea" rows="2" class="w-full text-xs px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-[18px] focus:outline-none focus:border-[#0C2B59] dark:text-white font-medium" placeholder="ഇവിടെ എഴുതുക..."></textarea>
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-3">
            <button id="sampleBtn" class="w-full py-3 px-4 bg-gradient-to-r from-[#0A2240] to-[#0C2B59] text-white font-extrabold text-xs rounded-[18px] shadow-lg shadow-blue-950/20 active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
              <span>🚀</span> <span>പോസ്റ്റ് പ്രസിദ്ധീകരിക്കാം</span>
            </button>
          </div>

        </div>
      </div>

    </div>

  </div>

  <script>
    let isCurved = true;

    function switchMode(mode) {
      isCurved = (mode === 'curved');
      const btnCurved = document.getElementById('btnCurved');
      const btnClassic = document.getElementById('btnClassic');
      const sheet = document.getElementById('modalSheet');
      const inp1 = document.getElementById('sampleInput1');
      const sel = document.getElementById('sampleSelect');
      const txt = document.getElementById('sampleTextarea');
      const btn = document.getElementById('sampleBtn');

      if (isCurved) {
        btnCurved.className = 'px-2.5 py-1 text-xs font-bold rounded-lg bg-[#0C2B59] text-white transition-all shadow-sm';
        btnClassic.className = 'px-2.5 py-1 text-xs font-bold rounded-lg text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-all';
        
        sheet.style.borderRadius = '36px 36px 0 0';
        sheet.style.height = '92%';
        inp1.style.borderRadius = '18px';
        sel.style.borderRadius = '18px';
        txt.style.borderRadius = '18px';
        btn.style.borderRadius = '18px';
      } else {
        btnClassic.className = 'px-2.5 py-1 text-xs font-bold rounded-lg bg-[#0C2B59] text-white transition-all shadow-sm';
        btnCurved.className = 'px-2.5 py-1 text-xs font-bold rounded-lg text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-all';
        
        sheet.style.borderRadius = '20px 20px 0 0';
        sheet.style.height = '75%';
        inp1.style.borderRadius = '8px';
        sel.style.borderRadius = '8px';
        txt.style.borderRadius = '8px';
        btn.style.borderRadius = '10px';
      }
    }

    function toggleModal(show) {
      const overlay = document.getElementById('modalOverlay');
      if (show) {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      } else {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      }
    }
  </script>
</body>
</html>
