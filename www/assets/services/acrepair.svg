<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="acUnit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#acGrad)"/>
  <!-- AC Indoor Unit -->
  <rect x="20" y="32" width="80" height="36" rx="6" fill="url(#acUnit)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Display LED -->
  <rect x="74" y="40" width="16" height="8" rx="2" fill="#0F172A"/>
  <circle cx="78" cy="44" r="1.5" fill="#10B981"/>
  <text x="85" y="46.5" font-size="5" font-weight="900" fill="#10B981" font-family="sans-serif">18°</text>
  <!-- Lower Air Vent -->
  <rect x="26" y="58" width="68" height="5" rx="1.5" fill="#CBD5E1"/>
  <!-- Cool Wind Streams -->
  <path d="M35 76 C40 86, 45 88, 50 98" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M55 76 C60 86, 65 88, 70 98" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M75 76 C80 86, 85 88, 90 98" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Snowflake -->
  <g transform="translate(30, 80) scale(0.65)" stroke="#67E8F9" stroke-width="3" stroke-linecap="round">
    <line x1="15" y1="5" x2="15" y2="25"/>
    <line x1="5" y1="15" x2="25" y2="15"/>
    <line x1="8" y1="8" x2="22" y2="22"/>
    <line x1="8" y1="22" x2="22" y2="8"/>
  </g>
</svg>