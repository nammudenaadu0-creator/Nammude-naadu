<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="taxiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#taxiGrad)"/>
  <!-- Road lines -->
  <line x1="15" y1="92" x2="105" y2="92" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="92" x2="45" y2="92" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="92" x2="90" y2="92" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  <!-- Taxi Sign on Top -->
  <rect x="49" y="32" width="22" height="9" rx="3" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  <text x="60" y="39" font-size="6.5" font-weight="900" text-anchor="middle" fill="#0F172A" font-family="sans-serif">TAXI</text>
  <!-- Car Roof & Windows -->
  <path d="M35 58 L45 42 H75 L85 58 Z" fill="#38BDF8" stroke="#0F172A" stroke-width="2"/>
  <line x1="60" y1="42" x2="60" y2="58" stroke="#0F172A" stroke-width="2"/>
  <!-- Car Main Body -->
  <path d="M22 58 Q20 62 20 68 L22 78 Q22 80 26 80 H94 Q98 80 98 78 L100 68 Q100 62 98 58 Z" fill="url(#carBody)" stroke="#CA8A04" stroke-width="2"/>
  <!-- Headlights -->
  <ellipse cx="26" cy="68" rx="4" ry="3" fill="#FEF08A"/>
  <ellipse cx="94" cy="68" rx="4" ry="3" fill="#FEF08A"/>
  <!-- Grill / Bumper -->
  <rect x="42" y="70" width="36" height="6" rx="2" fill="#334155"/>
  <!-- Wheels -->
  <circle cx="36" cy="82" r="9" fill="#0F172A" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="84" cy="82" r="9" fill="#0F172A" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="36" cy="82" r="3.5" fill="#E2E8F0"/>
  <circle cx="84" cy="82" r="3.5" fill="#E2E8F0"/>
</svg>